tasks:
- id: ahl-dev-markdown-footnote-backrefs
  repo: markdown
  category: bug-fix
  source: swe-smith
  bug_patches:
  - markdown.func_pm_op_change_const.218a9cb5a8.diff
  hide: true
  fail_to_pass:
  - testHeadingRemoveFootnoteRef (test_syntax.extensions.test_toc.TestTOC.testHeadingRemoveFootnoteRef)
  - test_duplicate_footnote_references (test_syntax.extensions.test_footnotes.TestFootnotes.test_duplicate_footnote_references)
  - test_footnote (test_legacy.TestExtensionsExtra.test_footnote)
  instruction: |
    The repository in `/app` is Python-Markdown.

    With the `footnotes` extension, a footnote that is referenced more than once must get one back-reference
    link (`&#8617;`) per reference at the end of its entry in the footnote list: the first link points to
    `#fnref:<label>`, the second to `#fnref2:<label>`, the third to `#fnref3:<label>`, and so on.

    Currently the last back-reference is missing. For example, for a footnote referenced twice only the
    `#fnref:<label>` link is rendered, while both references in the text get their ids (`fnref:<label>`
    and `fnref2:<label>`).

    Fix the library. Do not modify the existing tests.
- id: ahl-dev-more-itertools-collapse-levels
  repo: more-itertools
  category: bug-fix
  source: swe-smith
  bug_patches:
  - more-itertools.func_pm_op_change.ea5cdbc2a0.diff
  hide: true
  fail_to_pass:
  - tests/test_more.py::TestCollapse::test_collapse_flatten
  - tests/test_more.py::TestCollapse::test_collapse_to_level
  instruction: |
    The repository in `/app` is more-itertools.

    `more_itertools.collapse(iterable, base_type=None, levels=None)` flattens nested iterables. With
    `levels=n` it must flatten only the first `n` levels of nesting and keep anything deeper as it is:

        list(collapse([[1], 2, [[3], 4], [[[5]]]], levels=2)) == [1, 2, 3, 4, [5]]

    and `collapse(x, levels=1)` must give the same items as `flatten(x)`. At the moment the level limit is
    not respected when `levels` is given.

    Fix the library. Do not modify the existing tests.
