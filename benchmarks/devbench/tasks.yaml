- id: ahl-dev-more-itertools-seekable-index
  repo: more-itertools
  category: bug-fix
  source: swe-smith
  bug_patches:
  - more-itertools.func_pm_op_break_chains.a15c33ab6a.diff
  hide: true
  fail_to_pass:
  - tests/test_more.py::PeekableTests::test_indexing
  - tests/test_more.py::PeekableTests::test_prepend_indexing
  - tests/test_more.py::PeekableTests::test_slicing_negative_step_omitted_stop_read_bound
  instruction: |
    The repository in `/app` is more-itertools.

    Indexing a `peekable` or `seekable` iterator must look ahead without consuming items: for
    `p = more_itertools.seekable('abcdef')`, `p[2]` is `'c'`, and `next(p)` afterwards is still `'a'`. The same
    holds for `peekable`, including after `prepend()`.

    At the moment indexing further ahead than the items already cached raises `IndexError` (for example
    `seekable('abcdef')[2]` on a fresh iterator). Fix the library. Do not modify the existing tests.
- id: ahl-dev-more-itertools-gray-product
  repo: more-itertools
  category: bug-fix
  source: swe-smith
  bug_patches:
  - more-itertools.func_pm_op_change_const.f381c7d1ae.diff
  hide: true
  fail_to_pass:
  - tests/test_more.py::GrayProductTests::test_basic
  - tests/test_more.py::GrayProductTests::test_repeat
  - tests/test_more.py::GrayProductTests::test_repeat_with_iterators
  - tests/test_more.py::GrayProductTests::test_vs_product
  instruction: |
    The repository in `/app` is more-itertools.

    `more_itertools.gray_product(*iterables)` yields the Cartesian product in Gray-code order, where only one
    element changes between consecutive tuples:

        list(gray_product(('a', 'b', 'c'), range(1, 3)))
        == [('a', 1), ('b', 1), ('c', 1), ('c', 2), ('b', 2), ('a', 2)]

    It currently fails with `IndexError` (for example `list(gray_product('ab', [1, 2]))`). Fix the library so
    that it yields every combination exactly once in that order. Do not modify the existing tests.
