# Needs Docker, Harbor 0.25.0 and a running endpoint (docs/EVALUATION_GUIDE.md). For the variant that was run, see
# real_smoke.yaml.
kind: eval
name: baseline
seed: 0
model: {include: ../models/qwen3.8-27b.yaml}
inference:
  backend: vllm
  base_url: http://localhost:8000/v1
  # localhost inside a sandbox is the sandbox; 172.17.0.1 is Docker's default bridge gateway on Linux.
  agent_base_url: http://172.17.0.1:8000/v1
  api_key_env: AGENTLAB_API_KEY
  sampling: {temperature: 0.8, top_p: 1.0, top_k: 20, enable_thinking: false}
  server_args:
    override-generation-config: '{"temperature": 0.8, "top_p": 1.0}'
    default-chat-template-kwargs: '{"enable_thinking": false}'
    max-model-len: 131072
    language-model-only: true
    enable-prefix-caching: true
    mamba-cache-mode: align
    tool-call-parser: qwen3_xml
    reasoning-parser: qwen3
harnesses:
  - {include: ../harnesses/pi.yaml}
  - {include: ../harnesses/opencode.yaml}
datasets:
  - {include: ../datasets/smoke.yaml}
runner: {type: harbor, version: 0.25.0, environment: docker, n_concurrent: 4}
hardware: {include: ../hardware/mi325x-4.yaml}
